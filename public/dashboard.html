<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Download Bot · Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
  <style>
    :root {
      --bg0: #071018;
      --bg1: #0c1822;
      --panel: rgba(14, 28, 40, 0.72);
      --line: rgba(120, 180, 200, 0.14);
      --text: #e7f3f6;
      --muted: #7f9eaa;
      --accent: #2dd4bf;
      --accent-2: #38bdf8;
      --good: #34d399;
      --bad: #fb7185;
      --warn: #fbbf24;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      --radius: 22px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Sora", sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(45, 212, 191, 0.16), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(56, 189, 248, 0.12), transparent 50%),
        linear-gradient(165deg, var(--bg0), var(--bg1) 45%, #08141c);
      background-attachment: fixed;
    }
    .noise {
      pointer-events: none; position: fixed; inset: 0; opacity: 0.035; z-index: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }
    .wrap { position: relative; z-index: 1; width: min(1180px, calc(100% - 2rem)); margin: 0 auto; padding: 2rem 0 3.5rem; }
    header.hero { display: grid; gap: 1.1rem; margin-bottom: 1.25rem; animation: rise .7s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .brand-row { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 1rem; }
    .brand h1 { margin: 0; font-size: clamp(1.8rem, 4vw, 2.6rem); letter-spacing: -0.04em; line-height: 1.1; }
    .brand .mark { color: var(--accent); font-weight: 700; }
    .brand p { margin: 0.45rem 0 0; color: var(--muted); max-width: 36rem; line-height: 1.5; }
    .actions { display: flex; gap: 0.6rem; flex-wrap: wrap; }
    button, .pill {
      border: 1px solid var(--line); background: rgba(255,255,255,0.03); color: var(--text);
      border-radius: 999px; padding: 0.55rem 0.95rem; font: inherit; font-size: 0.85rem; cursor: pointer;
      transition: border-color .2s, background .2s, transform .15s;
    }
    button:hover { border-color: rgba(45,212,191,.45); background: rgba(45,212,191,.08); }
    button:active { transform: scale(0.98); }
    .tabs { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .tab {
      border: 1px solid var(--line); background: transparent; color: var(--muted);
      border-radius: 999px; padding: 0.5rem 1rem; font: inherit; font-size: 0.85rem; cursor: pointer;
    }
    .tab.active { color: var(--text); border-color: rgba(45,212,191,.4); background: rgba(45,212,191,.1); }
    .panel { display: none; }
    .panel.active { display: block; animation: rise .35s ease both; }
    .status-banner {
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.85rem 1.25rem;
      padding: 1rem 1.2rem; border-radius: var(--radius); border: 1px solid var(--line);
      background: var(--panel); backdrop-filter: blur(14px); box-shadow: var(--shadow);
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--muted); box-shadow: 0 0 0 6px rgba(127,158,170,.12); }
    .dot.ok { background: var(--good); box-shadow: 0 0 0 6px rgba(52,211,153,.15); animation: pulse 2s infinite; }
    .dot.bad { background: var(--bad); box-shadow: 0 0 0 6px rgba(251,113,133,.15); animation: pulse 1.2s infinite; }
    .dot.warn { background: var(--warn); box-shadow: 0 0 0 6px rgba(251,191,36,.15); }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
    .status-banner strong { font-size: 1.05rem; }
    .status-banner .meta { color: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: 0.78rem; }
    .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 1rem; }
    .card {
      grid-column: span 4; border: 1px solid var(--line); background: var(--panel);
      backdrop-filter: blur(14px); border-radius: var(--radius); padding: 1.15rem 1.2rem 1.25rem; box-shadow: var(--shadow);
    }
    .card.wide { grid-column: span 8; }
    .card.full { grid-column: span 12; }
    .card h2 {
      margin: 0 0 0.85rem; font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--muted); font-weight: 600;
    }
    .stat { font-size: clamp(1.4rem, 3vw, 1.85rem); font-weight: 700; letter-spacing: -0.03em; margin: 0; }
    .stat.mono { font-family: "IBM Plex Mono", monospace; font-size: 1.15rem; font-weight: 500; }
    .sub { margin: 0.35rem 0 0; color: var(--muted); font-size: 0.85rem; }
    .kv { display: grid; gap: 0.55rem; }
    .kv-row {
      display: flex; justify-content: space-between; gap: 1rem; padding: 0.45rem 0;
      border-bottom: 1px solid rgba(120,180,200,0.08); font-size: 0.9rem;
    }
    .kv-row span:first-child { color: var(--muted); }
    .kv-row span:last-child { font-family: "IBM Plex Mono", monospace; font-size: 0.82rem; text-align: right; word-break: break-all; }
    .tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.75rem; }
    .tag {
      font-size: 0.72rem; padding: 0.28rem 0.55rem; border-radius: 999px; border: 1px solid var(--line);
      color: var(--muted); background: rgba(255,255,255,0.02);
    }
    .tag.on { color: var(--good); border-color: rgba(52,211,153,.35); }
    .tag.off { color: var(--bad); border-color: rgba(251,113,133,.3); }
    .chart-box { height: 160px; margin-top: 0.5rem; }
    .console-toolbar { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.85rem; align-items: center; }
    .console-toolbar .grow { flex: 1; min-width: 140px; }
    .console-box {
      max-height: min(62vh, 560px); overflow: auto; font-family: "IBM Plex Mono", monospace; font-size: 0.78rem;
      display: grid; gap: 0.35rem; padding: 0.35rem; border-radius: 16px; background: rgba(0,0,0,.28);
      border: 1px solid rgba(120,180,200,.1);
    }
    .log-line {
      display: grid; grid-template-columns: 78px 58px 1fr; gap: 0.55rem; padding: 0.45rem 0.55rem;
      border-radius: 10px; background: rgba(255,255,255,0.02);
    }
    .log-line:hover { background: rgba(45,212,191,0.06); }
    .log-line .lvl-info { color: var(--accent-2); }
    .log-line .lvl-cmd { color: var(--accent); }
    .log-line .lvl-warn { color: var(--warn); }
    .log-line .lvl-error { color: var(--bad); }
    .log-line .time { color: var(--muted); }
    .filter-input {
      width: 100%; border: 1px solid var(--line); background: rgba(0,0,0,.25); color: var(--text);
      border-radius: 999px; padding: 0.5rem 0.9rem; font: inherit; font-size: 0.85rem; outline: none;
    }
    footer {
      margin-top: 1.5rem; color: var(--muted); font-size: 0.8rem;
      display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
    }
    .err {
      display: none; margin-top: 1rem; padding: 0.9rem 1rem; border-radius: 14px;
      border: 1px solid rgba(251,113,133,.35); background: rgba(251,113,133,.08); color: #fecdd3;
    }
    .err.show { display: block; }
    @media (max-width: 900px) {
      .card, .card.wide { grid-column: span 12; }
      .log-line { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="noise"></div>
  <div class="wrap">
    <header class="hero">
      <div class="brand-row">
        <div class="brand">
          <h1><span class="mark">Download</span> Bot</h1>
          <p>Session, uptime, chống die — và tab Console xem lệnh realtime.</p>
        </div>
        <div class="actions">
          <button type="button" id="btnRefresh">Refresh</button>
          <button type="button" id="btnLogout">Logout</button>
        </div>
      </div>

      <div class="tabs" role="tablist">
        <button type="button" class="tab active" data-tab="overview">Overview</button>
        <button type="button" class="tab" data-tab="console">Console</button>
      </div>

      <div class="status-banner" id="banner">
        <div class="dot warn" id="dot"></div>
        <div>
          <strong id="bannerTitle">Đang tải…</strong>
          <div class="meta" id="bannerMeta">—</div>
        </div>
      </div>
      <div class="err" id="errBox"></div>
    </header>

    <section class="panel active" id="panel-overview">
      <div class="grid">
        <article class="card">
          <h2>Session (cookie)</h2>
          <p class="stat" id="sessionState">—</p>
          <p class="sub" id="sessionUser">—</p>
          <div class="tags" id="sessionTags"></div>
        </article>
        <article class="card">
          <h2>MQTT listen</h2>
          <p class="stat" id="mqttState">—</p>
          <p class="sub" id="mqttSub">Kênh nhận tin Messenger</p>
          <div class="tags" id="mqttTags"></div>
        </article>
        <article class="card">
          <h2>Uptime</h2>
          <p class="stat mono" id="uptime">—</p>
          <p class="sub" id="uptimeSub">Process uptime</p>
        </article>
        <article class="card">
          <h2>Memory</h2>
          <p class="stat mono" id="mem">—</p>
          <p class="sub" id="memSub">—</p>
          <div class="chart-box"><canvas id="memChart"></canvas></div>
        </article>
        <article class="card wide">
          <h2>Runtime</h2>
          <div class="kv" id="runtimeKv"></div>
        </article>
        <article class="card">
          <h2>Anti-die</h2>
          <div class="kv" id="antiKv"></div>
          <div class="tags" id="antiTags"></div>
        </article>
      </div>
    </section>

    <section class="panel" id="panel-console">
      <article class="card full">
        <h2>Live console</h2>
        <div class="console-toolbar">
          <div class="grow">
            <input class="filter-input" id="logFilter" placeholder="Lọc: ping, download, error…" />
          </div>
          <button type="button" id="btnClearView">Clear view</button>
          <button type="button" id="btnCopyLogs">Copy logs</button>
        </div>
        <div class="console-box" id="logs">Chưa có log.</div>
      </article>
    </section>

    <footer>
      <span id="footLeft">bot-download-video</span>
      <span id="footRight">API · /api/status</span>
    </footer>
  </div>

  <script>
    let memChart;
    let lastPayload = null;
    let hideBefore = 0;

    const opts = { credentials: 'include', cache: 'no-store' };

    function fmtUptime(sec) {
      sec = Math.max(0, Math.floor(sec || 0));
      const d = Math.floor(sec / 86400);
      const h = Math.floor((sec % 86400) / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      const parts = [];
      if (d) parts.push(d + 'd');
      if (h || d) parts.push(h + 'h');
      parts.push(m + 'm', s + 's');
      return parts.join(' ');
    }
    function fmtTime(ts) { return ts ? new Date(ts).toLocaleString('vi-VN') : '—'; }
    function escapeHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function setKv(el, rows) {
      el.innerHTML = rows.map(([k,v]) => `<div class="kv-row"><span>${k}</span><span>${v ?? '—'}</span></div>`).join('');
    }

    document.querySelectorAll('.tab').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach((b) => b.classList.remove('active'));
        document.querySelectorAll('.panel').forEach((p) => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
      });
    });

    function renderLogs(logs) {
      const q = (document.getElementById('logFilter').value || '').trim().toLowerCase();
      const filtered = (logs || [])
        .filter((l) => (l.at || 0) >= hideBefore)
        .filter((l) => !q || `${l.level} ${l.message}`.toLowerCase().includes(q));
      const el = document.getElementById('logs');
      if (!filtered.length) {
        el.textContent = 'Không có log phù hợp.';
        return;
      }
      el.innerHTML = filtered.map((l) => {
        const t = new Date(l.at).toLocaleTimeString('vi-VN');
        const lvl = (l.level || 'info').toLowerCase();
        return `<div class="log-line"><span class="time">${t}</span><span class="lvl-${lvl}">${lvl}</span><span>${escapeHtml(l.message)}</span></div>`;
      }).join('');
    }

    function render(data) {
      lastPayload = data;
      const alive = data.session?.alive;
      const ready = data.bot?.ready;
      const health = data.health || {};
      const mqtt = data.mqtt || {};
      const dot = document.getElementById('dot');
      const level = health.level || (alive === true ? 'ok' : alive === false ? 'bad' : 'warn');
      dot.className = 'dot ' + level;
      document.getElementById('bannerTitle').textContent =
        `${data.bot?.name || 'Bot'} · ${health.label || '—'}`;
      document.getElementById('bannerMeta').textContent =
        `${health.detail || '—'} · check ${fmtTime(data.session?.lastCheckAt)} · refresh ${fmtTime(data.refreshedAt)}`;

      document.getElementById('sessionState').textContent =
        alive === true ? 'Alive' : alive === false ? 'Dead' : 'Unknown';
      document.getElementById('sessionUser').textContent = data.session?.userName
        ? `User: ${data.session.userName}` : 'Chưa có tên user';

      document.getElementById('mqttState').textContent =
        mqtt.connected === true ? 'Connected' : mqtt.connected === false ? 'Down' : 'Unknown';
      document.getElementById('mqttSub').textContent = mqtt.connected === false
        ? (mqtt.lastError || 'Server unavailable')
        : mqtt.lastEventAt
          ? `Last event ${fmtTime(mqtt.lastEventAt)}`
          : 'Kênh nhận tin Messenger';

      const mqttTags = document.getElementById('mqttTags');
      mqttTags.innerHTML = '';
      const addMqttTag = (text, cls) => {
        const s = document.createElement('span');
        s.className = 'tag ' + (cls || '');
        s.textContent = text;
        mqttTags.appendChild(s);
      };
      addMqttTag(mqtt.connected === true ? 'listen OK' : mqtt.connected === false ? 'listen fail' : 'pending',
        mqtt.connected === true ? 'on' : mqtt.connected === false ? 'off' : '');
      if (mqtt.reconnects) addMqttTag('reconnects: ' + mqtt.reconnects);
      const tags = document.getElementById('sessionTags');
      tags.innerHTML = '';
      const addTag = (text, cls) => {
        const s = document.createElement('span');
        s.className = 'tag ' + (cls || '');
        s.textContent = text;
        tags.appendChild(s);
      };
      addTag(ready ? 'botReady' : 'not ready', ready ? 'on' : 'off');
      if (data.session?.lastError) addTag('err: ' + String(data.session.lastError).slice(0, 40), 'off');
      addTag('fails: ' + (data.session?.consecutiveFails ?? 0));

      document.getElementById('uptime').textContent = fmtUptime(data.runtime?.uptimeSec);
      document.getElementById('uptimeSub').textContent =
        `Process ${fmtUptime(data.runtime?.processUptimeSec)} · PID ${data.runtime?.pid ?? '—'}`;

      const mem = data.runtime?.memory || {};
      document.getElementById('mem').textContent = `${mem.usedPercent ?? '—'}%`;
      document.getElementById('memSub').textContent = `${mem.usedLabel || '—'} / ${mem.totalLabel || '—'}`;

      if (window.Chart) {
        const used = mem.usedPercent ?? 0;
        const free = Math.max(0, 100 - used);
        const ctx = document.getElementById('memChart');
        if (memChart) {
          memChart.data.datasets[0].data = [used, free];
          memChart.update('none');
        } else {
          memChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
              labels: ['Used', 'Free'],
              datasets: [{ data: [used, free], backgroundColor: ['#2dd4bf', 'rgba(127,158,170,0.25)'], borderWidth: 0 }]
            },
            options: { cutout: '72%', plugins: { legend: { display: false } }, animation: { duration: 400 } }
          });
        }
      }

      setKv(document.getElementById('runtimeKv'), [
        ['Bot', data.bot?.name],
        ['Prefix', data.bot?.prefix],
        ['FCA', data.bot?.fca],
        ['Node', data.runtime?.node],
        ['Host', data.runtime?.hostname],
        ['Platform', data.runtime?.platform],
        ['CPU / Load', `${data.runtime?.cpus ?? '—'} · ${(data.runtime?.loadAvg || []).join(' / ')}`],
        ['Last OK', fmtTime(data.session?.lastOkAt)],
        ['Last error', data.session?.lastError || '—']
      ]);

      const anti = data.antiDie || {};
      setKv(document.getElementById('antiKv'), [
        ['Session check', `${anti.sessionCheckInterval ?? 5} min`],
        ['Send delay', `${anti.sendDelayMs ?? '—'} ms`],
        ['Download concurrency', anti.downloadConcurrency],
        ['URL cooldown', `${Math.round((anti.downloadCooldownMs || 0) / 1000)}s`],
        ['Login delay', `${anti.loginDelayMs ?? '—'} ms`],
        ['Proxy', anti.proxy || 'direct']
      ]);
      const antiTags = document.getElementById('antiTags');
      antiTags.innerHTML = '';
      [['proxy', anti.proxyEnabled], ['auto-restart', anti.autoRestart]].forEach(([name, on]) => {
        const s = document.createElement('span');
        s.className = 'tag ' + (on ? (name === 'auto-restart' ? '' : 'on') : 'off');
        s.textContent = on ? name + ' on' : name + ' off';
        antiTags.appendChild(s);
      });

      renderLogs(data.logs || []);
      document.getElementById('footLeft').textContent = `${data.service || 'bot'} · cookie session`;
      document.getElementById('footRight').textContent = `Updated ${fmtTime(data.refreshedAt)} · ${ (data.logs||[]).length } logs`;
    }

    async function load() {
      const errBox = document.getElementById('errBox');
      try {
        const res = await fetch('/api/status', opts);
        if (res.status === 401) {
          location.href = '/login?next=' + encodeURIComponent('/');
          return;
        }
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.error || `HTTP ${res.status}`);
        }
        const data = await res.json();
        errBox.classList.remove('show');
        render(data);
      } catch (e) {
        errBox.textContent = 'Không tải được status: ' + e.message;
        errBox.classList.add('show');
      }
    }

    document.getElementById('btnRefresh').addEventListener('click', load);
    document.getElementById('logFilter').addEventListener('input', () => {
      if (lastPayload) renderLogs(lastPayload.logs || []);
    });
    document.getElementById('btnClearView').addEventListener('click', () => {
      hideBefore = Date.now();
      if (lastPayload) renderLogs(lastPayload.logs || []);
    });
    document.getElementById('btnCopyLogs').addEventListener('click', async () => {
      const logs = (lastPayload?.logs || []).filter((l) => (l.at || 0) >= hideBefore);
      const text = logs.map((l) => `${new Date(l.at).toISOString()} [${l.level}] ${l.message}`).join('\n');
      await navigator.clipboard.writeText(text);
      const b = document.getElementById('btnCopyLogs');
      b.textContent = 'Copied!';
      setTimeout(() => (b.textContent = 'Copy logs'), 1000);
    });
    document.getElementById('btnLogout').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST', ...opts });
      location.href = '/login';
    });

    load();
    setInterval(load, 5000);
  </script>
</body>
</html>
