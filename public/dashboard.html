<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Download Bot · Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f7f5;
      --text: #15231c;
      --muted: #5f7368;
      --line: #d7e2db;
      --accent: #0d8f6f;
      --accent-soft: #e6f5ef;
      --good: #15803d;
      --bad: #c2410c;
      --warn: #b45309;
      --panel: #fff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Sora", sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #f8fbf9, var(--bg));
    }
    .wrap { width: min(820px, calc(100% - 1.5rem)); margin: 0 auto; padding: 1.5rem 0 2.5rem; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin-bottom: 1.1rem;
    }
    .brand h1 { margin: 0; font-size: 1.45rem; letter-spacing: -.03em; }
    .brand .mark { color: var(--accent); }
    .top-actions { display: flex; gap: .35rem; }
    button {
      border: 1px solid var(--line); background: var(--panel); color: var(--text);
      border-radius: 9px; padding: .45rem .8rem; font: inherit; font-size: .82rem; cursor: pointer;
    }
    button:hover { background: var(--accent-soft); border-color: #b5d0c4; }
    button:disabled { opacity: .55; cursor: wait; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    button.primary:hover { filter: brightness(1.04); background: var(--accent); }
    button.danger { color: var(--bad); border-color: #f0c4b0; background: #fff8f5; }
    button.ghost { border-color: transparent; background: transparent; color: var(--muted); }
    button.ghost:hover { background: #eaf0ec; }
    .status {
      display: flex; align-items: flex-start; gap: .75rem; padding: .85rem 0 1rem;
      border-bottom: 1px solid var(--line); margin-bottom: 1rem;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); margin-top: .35rem; flex-shrink: 0; }
    .dot.ok { background: var(--good); }
    .dot.bad { background: var(--bad); }
    .dot.warn { background: var(--warn); }
    .status strong { display: block; font-size: .98rem; }
    .status .meta { color: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: .74rem; margin-top: .2rem; }
    .metrics {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: .75rem 1rem;
      margin-bottom: 1.1rem; padding-bottom: 1rem; border-bottom: 1px solid var(--line);
    }
    .metric .label { font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
    .metric .value { margin-top: .2rem; font-size: 1.05rem; font-weight: 600; }
    .metric .hint { margin-top: .15rem; font-size: .78rem; color: var(--muted); }
    .notice {
      display: none; margin-bottom: .9rem; padding: .7rem .85rem; border-radius: 10px; font-size: .86rem;
    }
    .notice.show { display: block; }
    .notice.ok { background: #edf9f1; color: #166534; }
    .notice.warn { background: #fff8eb; color: #92400e; }
    .notice.err { background: #fff5f0; color: #9a3412; }
    .tabs { display: flex; gap: .25rem; margin-bottom: 1rem; }
    .tab {
      border: 0; background: transparent; color: var(--muted); border-radius: 8px;
      padding: .4rem .75rem; font: inherit; font-size: .84rem; cursor: pointer;
    }
    .tab.active { color: var(--accent); background: var(--accent-soft); font-weight: 600; }
    .panel { display: none; }
    .panel.active { display: block; }
    .section-title {
      margin: 0 0 .55rem; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
    }
    .hint { margin: 0 0 .7rem; color: var(--muted); font-size: .84rem; line-height: 1.45; }
    textarea {
      width: 100%; min-height: 220px; resize: vertical;
      border: 1px solid var(--line); border-radius: 12px; padding: .85rem;
      font-family: "IBM Plex Mono", monospace; font-size: .78rem; line-height: 1.45;
      background: #fff; color: var(--text); outline: none;
    }
    textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(13,143,111,.12); }
    .row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-top: .75rem; }
    .row .spacer { flex: 1; }
    .divider {
      height: 1px; background: var(--line); margin: 1.25rem 0;
    }
    .console-toolbar { display: flex; gap: .4rem; margin-bottom: .6rem; align-items: center; }
    .console-toolbar .grow { flex: 1; }
    .filter-input {
      width: 100%; border: 1px solid var(--line); background: #fff; color: var(--text);
      border-radius: 9px; padding: .45rem .75rem; font: inherit; font-size: .84rem; outline: none;
    }
    .console-box {
      max-height: min(55vh, 480px); overflow: auto;
      font-family: "IBM Plex Mono", monospace; font-size: .76rem;
      display: grid; gap: .25rem;
    }
    .log-line {
      display: grid; grid-template-columns: 70px 48px 1fr; gap: .45rem;
      padding: .35rem 0; border-bottom: 1px solid #edf2ee;
    }
    .log-line .time { color: var(--muted); }
    .log-line .lvl-info { color: #1a7a9c; }
    .log-line .lvl-cmd { color: var(--accent); }
    .log-line .lvl-warn { color: var(--warn); }
    .log-line .lvl-error { color: var(--bad); }
    footer {
      margin-top: 1.5rem; padding-top: .85rem; border-top: 1px solid var(--line);
      color: var(--muted); font-size: .76rem;
      display: flex; justify-content: space-between; gap: .75rem; flex-wrap: wrap;
    }
    @media (max-width: 640px) {
      .metrics { grid-template-columns: 1fr 1fr; }
      .log-line { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <h1><span class="mark">Download</span> Bot</h1>
      </div>
      <div class="top-actions">
        <button type="button" id="btnRefresh" class="ghost">Refresh</button>
        <button type="button" id="btnLogout" class="ghost">Logout</button>
      </div>
    </div>

    <div class="status" id="banner">
      <div class="dot warn" id="dot"></div>
      <div>
        <strong id="bannerTitle">Đang tải…</strong>
        <div class="meta" id="bannerMeta">—</div>
      </div>
    </div>
    <div class="notice" id="notice"></div>

    <div class="metrics">
      <div class="metric">
        <div class="label">Session</div>
        <div class="value" id="sessionState">—</div>
        <div class="hint" id="sessionUser">—</div>
      </div>
      <div class="metric">
        <div class="label">MQTT</div>
        <div class="value" id="mqttState">—</div>
        <div class="hint" id="mqttSub">—</div>
      </div>
      <div class="metric">
        <div class="label">Uptime</div>
        <div class="value" id="uptime" style="font-family:IBM Plex Mono,monospace;font-size:.95rem;font-weight:500">—</div>
        <div class="hint" id="uptimeSub">—</div>
      </div>
      <div class="metric">
        <div class="label">Memory</div>
        <div class="value" id="mem" style="font-family:IBM Plex Mono,monospace;font-size:.95rem;font-weight:500">—</div>
        <div class="hint" id="memSub">—</div>
      </div>
    </div>

    <nav class="tabs">
      <button type="button" class="tab active" data-tab="appstate">Appstate</button>
      <button type="button" class="tab" data-tab="console">Console</button>
    </nav>

    <section class="panel active" id="panel-appstate">
      <p class="section-title">Paste appstate</p>
      <p class="hint">Dán mảng cookie JSON → Lưu & restart.</p>
      <textarea id="appstatePaste" placeholder='[{"key":"c_user","value":"...","domain":".facebook.com",...}]' spellcheck="false"></textarea>
      <div class="row">
        <button type="button" id="btnPasteSave" class="primary">Lưu & restart</button>
        <button type="button" id="btnClearPaste" class="ghost">Xóa</button>
        <span class="spacer"></span>
        <button type="button" id="btnFromJsonbin">Từ JSONBin</button>
        <button type="button" id="btnCheckSession">Check session</button>
        <button type="button" id="btnRestart" class="danger">Restart</button>
      </div>
    </section>

    <section class="panel" id="panel-console">
      <div class="console-toolbar">
        <div class="grow">
          <input class="filter-input" id="logFilter" placeholder="Lọc log…" />
        </div>
        <button type="button" id="btnClearView" class="ghost">Clear</button>
        <button type="button" id="btnCopyLogs" class="ghost">Copy</button>
      </div>
      <div class="console-box" id="logs">Chưa có log.</div>
    </section>

    <footer>
      <span id="footLeft">bot-download-video</span>
      <span id="footRight">—</span>
    </footer>
  </div>

  <script>
    let lastPayload = null, hideBefore = 0;
    const opts = { credentials: 'include', cache: 'no-store' };

    function fmtUptime(sec) {
      sec = Math.max(0, Math.floor(sec || 0));
      const d = Math.floor(sec / 86400), h = Math.floor((sec % 86400) / 3600);
      const m = Math.floor((sec % 3600) / 60), s = sec % 60;
      const p = [];
      if (d) p.push(d + 'd');
      if (h || d) p.push(h + 'h');
      p.push(m + 'm', s + 's');
      return p.join(' ');
    }
    function fmtTime(ts) { return ts ? new Date(ts).toLocaleString('vi-VN') : '—'; }
    function escapeHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function showNotice(text, type = 'ok', persist = false) {
      const el = document.getElementById('notice');
      el.textContent = text;
      el.className = 'notice show ' + type;
      if (!persist) setTimeout(() => el.classList.remove('show'), type === 'warn' ? 8000 : 4000);
    }
    function clearNotice() {
      document.getElementById('notice').classList.remove('show');
    }

    document.querySelectorAll('.tab').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach((b) => b.classList.remove('active'));
        document.querySelectorAll('.panel').forEach((p) => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
      });
    });

    function renderLogs(logs) {
      const q = (document.getElementById('logFilter').value || '').trim().toLowerCase();
      const filtered = (logs || [])
        .filter((l) => (l.at || 0) >= hideBefore)
        .filter((l) => !q || `${l.level} ${l.message}`.toLowerCase().includes(q));
      const el = document.getElementById('logs');
      if (!filtered.length) { el.textContent = 'Không có log.'; return; }
      el.innerHTML = filtered.map((l) => {
        const t = new Date(l.at).toLocaleTimeString('vi-VN');
        const lvl = (l.level || 'info').toLowerCase();
        return `<div class="log-line"><span class="time">${t}</span><span class="lvl-${lvl}">${lvl}</span><span>${escapeHtml(l.message)}</span></div>`;
      }).join('');
    }

    function render(data) {
      lastPayload = data;
      const alive = data.session?.alive;
      const health = data.health || {};
      const mqtt = data.mqtt || {};
      document.getElementById('dot').className = 'dot ' + (health.level || 'warn');
      document.getElementById('bannerTitle').textContent = `${data.bot?.name || 'Bot'} · ${health.label || '—'}`;
      document.getElementById('bannerMeta').textContent = `${health.detail || '—'} · ${fmtTime(data.refreshedAt)}`;

      document.getElementById('sessionState').textContent =
        alive === true ? 'Alive' : alive === false ? 'Dead' : '—';
      document.getElementById('sessionUser').textContent = data.session?.userName || '—';

      document.getElementById('mqttState').textContent =
        mqtt.connected === true ? 'OK' : mqtt.connected === false ? 'Down' : '—';
      document.getElementById('mqttSub').textContent = mqtt.connected === false
        ? (mqtt.lastError || 'Không nhận tin').slice(0, 40)
        : mqtt.lastEventAt ? fmtTime(mqtt.lastEventAt) : 'Chờ event';

      document.getElementById('uptime').textContent = fmtUptime(data.runtime?.uptimeSec);
      document.getElementById('uptimeSub').textContent = `PID ${data.runtime?.pid ?? '—'}`;

      const mem = data.runtime?.memory || {};
      document.getElementById('mem').textContent = `${mem.usedPercent ?? '—'}%`;
      document.getElementById('memSub').textContent = mem.usedLabel || '—';

      renderLogs(data.logs || []);
      document.getElementById('footLeft').textContent = data.service || 'bot-download-video';
      document.getElementById('footRight').textContent = fmtTime(data.refreshedAt);
    }

    async function load() {
      clearNotice();
      try {
        const res = await fetch('/api/status', opts);
        if (res.status === 401) { location.href = '/login?next=/'; return; }
        if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || `HTTP ${res.status}`);
        render(await res.json());
      } catch (e) {
        showNotice('Không tải được: ' + e.message, 'err', true);
      }
    }

    async function postAction(url, body, btn, busy) {
      const prev = btn?.textContent;
      if (btn) { btn.disabled = true; btn.textContent = busy; }
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: body ? { 'Content-Type': 'application/json' } : undefined,
          body: body ? JSON.stringify(body) : undefined,
          ...opts
        });
        const data = await res.json().catch(() => ({}));
        if (res.status === 401) { location.href = '/login?next=/'; return null; }
        if (!res.ok || !data.ok) throw new Error(data.error || `HTTP ${res.status}`);
        return data;
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = prev; }
      }
    }

    async function waitForBot() {
      showNotice('Bot đang khởi động lại…', 'warn', true);
      for (let i = 0; i < 40; i++) {
        await new Promise((r) => setTimeout(r, 3000));
        try {
          const h = await fetch('/health', { cache: 'no-store' });
          if (h.ok) { location.reload(); return; }
        } catch (_) {}
      }
      location.reload();
    }

    document.getElementById('btnRefresh').addEventListener('click', load);

    document.getElementById('btnPasteSave').addEventListener('click', async (e) => {
      const raw = document.getElementById('appstatePaste').value;
      if (!raw.trim()) { showNotice('Chưa dán appstate', 'err'); return; }
      try {
        const data = await postAction('/api/actions/paste-appstate', { appstate: raw }, e.currentTarget, 'Đang lưu…');
        if (!data) return;
        if (data.restarting) return waitForBot();
        showNotice(data.message || 'Xong', 'ok');
      } catch (ex) {
        showNotice(ex.message, 'err', true);
      }
    });

    document.getElementById('btnClearPaste').addEventListener('click', () => {
      document.getElementById('appstatePaste').value = '';
    });

    document.getElementById('btnFromJsonbin').addEventListener('click', async (e) => {
      try {
        const data = await postAction('/api/actions/apply-appstate', { force: true }, e.currentTarget, 'Đang tải…');
        if (!data) return;
        if (data.restarting) return waitForBot();
        showNotice(data.message || 'Xong', 'ok');
        await load();
      } catch (ex) {
        showNotice(ex.message, 'err', true);
      }
    });

    document.getElementById('btnCheckSession').addEventListener('click', async (e) => {
      try {
        const data = await postAction('/api/actions/check-session', null, e.currentTarget, '…');
        if (!data) return;
        showNotice(data.message || 'Xong', data.session?.alive ? 'ok' : 'err');
        await load();
      } catch (ex) { showNotice(ex.message, 'err', true); }
    });

    document.getElementById('btnRestart').addEventListener('click', async (e) => {
      if (!confirm('Restart bot ngay?')) return;
      try {
        const data = await postAction('/api/actions/restart', null, e.currentTarget, '…');
        if (!data) return;
        await waitForBot();
      } catch (ex) { showNotice(ex.message, 'err', true); }
    });

    document.getElementById('logFilter').addEventListener('input', () => {
      if (lastPayload) renderLogs(lastPayload.logs || []);
    });
    document.getElementById('btnClearView').addEventListener('click', () => {
      hideBefore = Date.now();
      if (lastPayload) renderLogs(lastPayload.logs || []);
    });
    document.getElementById('btnCopyLogs').addEventListener('click', async () => {
      const logs = (lastPayload?.logs || []).filter((l) => (l.at || 0) >= hideBefore);
      await navigator.clipboard.writeText(
        logs.map((l) => `${new Date(l.at).toISOString()} [${l.level}] ${l.message}`).join('\n')
      );
      showNotice('Đã copy logs', 'ok');
    });
    document.getElementById('btnLogout').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST', ...opts });
      location.href = '/login';
    });

    load();
    setInterval(load, 5000);
  </script>
</body>
</html>
