<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login · Download Bot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f3f6f4;
      --panel: #ffffff;
      --line: #d5e0d8;
      --text: #15231c;
      --muted: #5f7368;
      --accent: #0d8f6f;
      --bad: #c2410c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Sora", sans-serif;
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background:
        radial-gradient(800px 400px at 15% 0%, rgba(13,143,111,.1), transparent 55%),
        radial-gradient(600px 360px at 100% 100%, rgba(26,122,156,.07), transparent 50%),
        linear-gradient(180deg, #f7faf8, var(--bg));
    }
    .card {
      width: min(400px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 2rem 1.75rem 1.75rem;
      box-shadow: 0 16px 40px rgba(21, 35, 28, 0.08);
      animation: rise .45s ease both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    h1 { margin: 0 0 1.25rem; font-size: 1.55rem; letter-spacing: -0.03em; }
    h1 span { color: var(--accent); }
    label {
      display: block;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }
    input {
      width: 100%;
      border: 1px solid var(--line);
      background: #f8faf9;
      color: var(--text);
      border-radius: 12px;
      padding: 0.85rem 1rem;
      font: inherit;
      outline: none;
      margin-bottom: 1rem;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(13,143,111,.12);
      background: #fff;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 0.9rem 1rem;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      background: var(--accent);
    }
    button:hover { filter: brightness(1.05); }
    button:disabled { opacity: .6; cursor: wait; }
    .err {
      display: none;
      margin-bottom: 0.9rem;
      padding: 0.7rem 0.85rem;
      border-radius: 10px;
      background: #fff5f0;
      border: 1px solid #f0c4b0;
      color: #9a3412;
      font-size: 0.88rem;
    }
    .err.show { display: block; }
  </style>
</head>
<body>
  <form class="card" id="form">
    <h1><span>Download</span> Bot</h1>
    <div class="err" id="err"></div>
    <label for="token">Mật khẩu</label>
    <input id="token" name="token" type="password" autocomplete="current-password" placeholder="Mật khẩu" required autofocus />
    <button type="submit" id="btn">Đăng nhập</button>
  </form>

  <script>
    const params = new URLSearchParams(location.search);
    const next = params.get('next') || '/';
    const form = document.getElementById('form');
    const err = document.getElementById('err');
    const btn = document.getElementById('btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.classList.remove('show');
      btn.disabled = true;
      btn.textContent = 'Đang đăng nhập…';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: document.getElementById('token').value })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) throw new Error(data.error || 'Login failed');
        location.href = next.startsWith('/') ? next : '/';
      } catch (ex) {
        err.textContent = ex.message;
        err.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Đăng nhập';
      }
    });
  </script>
</body>
</html>
