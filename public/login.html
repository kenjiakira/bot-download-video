<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login · Download Bot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg0: #071018;
      --panel: rgba(14, 28, 40, 0.85);
      --line: rgba(120, 180, 200, 0.16);
      --text: #e7f3f6;
      --muted: #7f9eaa;
      --accent: #2dd4bf;
      --bad: #fb7185;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Sora", sans-serif;
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background:
        radial-gradient(900px 500px at 20% 0%, rgba(45, 212, 191, 0.18), transparent 55%),
        radial-gradient(700px 400px at 100% 100%, rgba(56, 189, 248, 0.12), transparent 50%),
        linear-gradient(165deg, #071018, #0c1822 50%, #08141c);
    }
    .card {
      width: min(420px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 2rem 1.75rem 1.75rem;
      box-shadow: 0 30px 70px rgba(0,0,0,.45);
      backdrop-filter: blur(16px);
      animation: rise .55s ease both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }
    h1 {
      margin: 0;
      font-size: 1.65rem;
      letter-spacing: -0.03em;
    }
    h1 span { color: var(--accent); }
    p {
      margin: 0.55rem 0 1.4rem;
      color: var(--muted);
      line-height: 1.5;
      font-size: 0.92rem;
    }
    label {
      display: block;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.45rem;
    }
    input {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(0,0,0,.25);
      color: var(--text);
      border-radius: 14px;
      padding: 0.9rem 1rem;
      font: inherit;
      outline: none;
      margin-bottom: 1rem;
    }
    input:focus { border-color: rgba(45,212,191,.55); }
    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 0.95rem 1rem;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      color: #042f2e;
      background: linear-gradient(135deg, #2dd4bf, #38bdf8);
    }
    button:hover { filter: brightness(1.05); }
    button:disabled { opacity: .6; cursor: wait; }
    .err {
      display: none;
      margin-bottom: 0.9rem;
      padding: 0.7rem 0.85rem;
      border-radius: 12px;
      background: rgba(251,113,133,.1);
      border: 1px solid rgba(251,113,133,.35);
      color: #fecdd3;
      font-size: 0.88rem;
    }
    .err.show { display: block; }
  </style>
</head>
<body>
  <form class="card" id="form">
    <h1><span>Download</span> Bot</h1>
    <div class="err" id="err"></div>
    <label for="token">Mật khẩu</label>
    <input id="token" name="token" type="password" autocomplete="current-password" placeholder="Mật khẩu" required autofocus />
    <button type="submit" id="btn">Đăng nhập</button>
  </form>

  <script>
    const params = new URLSearchParams(location.search);
    const next = params.get('next') || '/';
    const form = document.getElementById('form');
    const err = document.getElementById('err');
    const btn = document.getElementById('btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.classList.remove('show');
      btn.disabled = true;
      btn.textContent = 'Đang đăng nhập…';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: document.getElementById('token').value })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) throw new Error(data.error || 'Login failed');
        location.href = next.startsWith('/') ? next : '/';
      } catch (ex) {
        err.textContent = ex.message;
        err.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Đăng nhập';
      }
    });
  </script>
</body>
</html>
